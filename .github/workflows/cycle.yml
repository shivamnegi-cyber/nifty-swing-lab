name: Trading cycle

on:
  schedule:
    - cron: "0 4 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "20 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trading-cycle
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run the trading cycle
        env:
          MODE: paper
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_cycle.py
      - name: Commit audit records
        run: |
          git config user.name "swing-lab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add records logs 2>/dev/null || true
          git commit -m "records: $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git push || echo "nothing to push"
      - name: Prepare site
        run: mkdir -p site && cp dashboard.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
